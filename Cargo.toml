[package]
name = "pdf-r2l-linux"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "PDFの綴じ方向(R2L/L2R)を変更するLinux GUIアプリ"

[dependencies]
lopdf = "0.34"
eframe = "0.29"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.deb]
name = "pdf-r2l-linux"
maintainer = "aon-co-jp <noreply@github.com>"
copyright = "See /usr/share/doc/pdf-r2l-linux/copyright (English and Japanese)"
extended-description = "Change the PDF binding direction (R2L). PDFの綴じ方向を変更するGUIアプリ。"
section = "utils"
priority = "optional"
depends = "$auto, fonts-noto-cjk | fonts-ipafont-gothic, xdg-desktop-portal"
assets = [
  ["target/release/pdf-r2l-linux", "usr/bin/", "755"],
  ["LICENSES.txt", "usr/share/doc/pdf-r2l-linux/copyright", "644"],
  ["packaging/pdf-r2l-linux.desktop", "usr/share/applications/", "644"],
]
